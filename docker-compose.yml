# A3 Lean — installation chez soi
#   docker compose up -d        puis ouvrir http://localhost:8000
# Au premier lancement, le modèle d'IA (~2 Go) se télécharge en arrière-plan : l'éditeur marche tout de suite,
# l'aide à la rédaction (volet ✨ IA) dès que le téléchargement est fini (suivi : docker compose logs -f ollama-pull).
# Réglages (port, modèle, version…) : fichier .env à côté de celui-ci, voir .env.example.
#
# Connexion : désactivée par défaut (A3_AUTH=aucune, une seule personne, port ouvert seulement sur cette machine).
#   Pour travailler à plusieurs : A3_AUTH=connexion dans .env (comptes par code e-mail ou SSO, partage des
#   dossiers et rapports), voir .env.example et le guide « Travailler à plusieurs ».

services:
  a3-lean:
    image: ghcr.io/rouxhero/a3-lean:${A3_VERSION:-latest}
    ports:
      - "127.0.0.1:${A3_PORT:-8000}:8000"
    volumes:
      - ./data:/data              # rapports, images, versions : sauvegarder ce dossier
    environment:
      A3_LLM_URL: ${A3_LLM_URL:-http://ollama:11434/v1}
      A3_LLM_MODEL: ${A3_LLM_MODEL:-qwen2.5:3b}
      A3_LLM_API_KEY: ${A3_LLM_API_KEY:-}
      A3_LLM_TIMEOUT: ${A3_LLM_TIMEOUT:-600}
      A3_MCP: ${A3_MCP:-1}  # outils IA externes (/mcp, jeton personnel) ; 0 = coupé
      A3_DEV_USER: ${A3_AUTEUR:-moi}  # nom de l'auteur sans connexion (versions, notes de relecture)
      A3_AUTH: ${A3_AUTH:-aucune}     # connexion = comptes (code par e-mail ou SSO) et partage
      A3_PUBLIC_URL: ${A3_PUBLIC_URL:-}
      A3_ADMINS: ${A3_ADMINS:-}
      A3_TRUST_PROXY_HEADERS: ${A3_TRUST_PROXY_HEADERS:-0}
      A3_SMTP_HOST: ${A3_SMTP_HOST:-}
      A3_SMTP_PORT: ${A3_SMTP_PORT:-}
      A3_SMTP_SECURITY: ${A3_SMTP_SECURITY:-}
      A3_SMTP_USER: ${A3_SMTP_USER:-}
      A3_SMTP_PASSWORD: ${A3_SMTP_PASSWORD:-}
      A3_SMTP_FROM: ${A3_SMTP_FROM:-}
      A3_OIDC_NAME: ${A3_OIDC_NAME:-}
      A3_OIDC_ISSUER: ${A3_OIDC_ISSUER:-}
      A3_OIDC_CLIENT_ID: ${A3_OIDC_CLIENT_ID:-}
      A3_OIDC_CLIENT_SECRET: ${A3_OIDC_CLIENT_SECRET:-}
    depends_on:
      - ollama
    restart: unless-stopped

  # IA locale (CPU suffit ; ~3 Go de RAM pour qwen2.5:3b). Le modèle se décharge après 10 min sans demande.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 10m
    restart: unless-stopped

  # Télécharge le modèle s'il manque, puis s'arrête (rien à faire s'il est déjà là)
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
      MODELE: ${A3_LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$MODELE\""]
    depends_on:
      - ollama
    restart: "no"
